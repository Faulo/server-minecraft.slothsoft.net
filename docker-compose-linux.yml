services:
    frontend:
        container_name: ${STACK_NAME}_frontend
        build:
            dockerfile: Dockerfile.linux
            args:
                PHP_VERSION: ${PHP_VERSION}
        environment:
            SERVER_NAME: ${SERVER_NAME}
            VIRTUAL_HOST: ${SERVER_NAME}
            LETSENCRYPT_HOST: ${SERVER_NAME}
        volumes:
            - farah-data:/var/www/data/
        tmpfs:
            - /var/www/cache/:uid=33,gid=33
        networks:
            - vhosts
        expose:
            - 80
        restart: unless-stopped

    world:
        container_name: ${STACK_NAME}_world
        image: itzg/minecraft-server:latest
        user: root
        cap_add:
            - SYS_NICE
        environment:
            EULA: TRUE
            MAX_MEMORY: 32G
            ONLINE_MODE: FALSE
        volumes:
            - world:/data
        ports:
            - 25565:25565
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        restart: unless-stopped

    geyser:
        container_name: ${STACK_NAME}_geyser
        image: itzg/minecraft-server:latest
        user: root
        entrypoint:
            - /bin/bash
            - -c
        command:
            - |
                set -e
                curl --fail --silent --show-error --location \
                    --output /tmp/Geyser-Standalone.jar \
                    https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/standalone
                exec java \
                    -Xms512M \
                    -Xmx1G \
                    --enable-native-access=ALL-UNNAMED \
                    -DgeyserUdpAddress=0.0.0.0 \
                    -DgeyserUdpPort=19132 \
                    -jar /tmp/Geyser-Standalone.jar \
                    --nogui \
                    --config /data/config.yml \
                    --java.address=world \
                    --java.port=25565 \
                    --java.auth-type=offline
        depends_on:
            - world
        volumes:
            - geyser:/data
        ports:
            - 19132:19132/udp
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        restart: unless-stopped

networks:
    vhosts:
        external: true

volumes:
    farah-data:
    world:
    geyser:
