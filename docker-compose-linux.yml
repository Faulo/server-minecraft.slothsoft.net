services:
    frontend:
        container_name: ${STACK_NAME}_frontend
        build:
            dockerfile: Dockerfile.linux
            args:
                PHP_VERSION: ${PHP_VERSION}
        environment:
            SERVER_NAME: ${SERVER_NAME}
            VIRTUAL_HOST: ${SERVER_NAME}
            LETSENCRYPT_HOST: ${SERVER_NAME}
        volumes:
            - farah-data:/var/www/data/
        tmpfs:
            - /var/www/cache/:uid=33,gid=33
        networks:
            - vhosts
        expose:
            - 80
        restart: unless-stopped

    world:
        container_name: ${STACK_NAME}_world
        image: itzg/minecraft-server:latest
        pull_policy: daily
        user: root
        cap_add:
            - SYS_NICE
        environment:
            EULA: "TRUE"
            TYPE: FABRIC
            ONLINE_MODE: "TRUE"
            ENFORCE_SECURE_PROFILE: "TRUE"
            MAX_MEMORY: 32G
            MODRINTH_PROJECTS: |
                fabric-api
                floodgate
            MODS: |
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/fabric
        volumes:
            - world:/data
        configs:
            - source: floodgate
              target: /config/floodgate/config.yml
        ports:
            - 25565:25565/tcp
            - 19132:19132/udp
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        restart: unless-stopped

configs:
    floodgate:
        content: |
            key-file-name: key.pem
            username-prefix: "."
            replace-spaces: true

            disconnect:
              invalid-key: Please connect through the official Geyser
              invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

            player-link:
              enabled: true
              require-link: true
              enable-own-linking: false
              allowed: true
              link-code-timeout: 300
              type: sqlite
              enable-global-linking: true

            metrics:
              enabled: false
              uuid: 00000000-0000-0000-0000-000000000000

            config-version: 3

networks:
    vhosts:
        external: true

volumes:
    farah-data:
    world:
        external: true
        name: minecraft_world
