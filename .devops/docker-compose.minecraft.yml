services:
  frontend:
    volumes:
      - bluemap-web:/var/www/html/WorldMap:ro

  bluemap:
    image: ghcr.io/bluemap-minecraft/bluemap:latest
    command: -r -u
    volumes:
      - bluemap-config:/app/config
      - bluemap-data:/app/data
      - bluemap-web:/app/web
      - world:/app/server:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == groke
      restart_policy:
        condition: any

  world:
    image: itzg/minecraft-server:latest
    user: root
    cap_add:
      - SYS_NICE
    environment:
      EULA: "TRUE"
      VERSION: "26.3"
      TYPE: FABRIC
      ONLINE_MODE: "TRUE"
      ENFORCE_SECURE_PROFILE: "TRUE"
      MAX_MEMORY: 32G
      MODRINTH_PROJECTS: |
        fabric-api
        floodgate
      MODS: |
        https://download.geysermc.org/v2/projects/geyserpreview/versions/pr.6712/builds/latest/downloads/fabric
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/slothsoft_minecraft_rcon_v1
    secrets:
      - slothsoft_minecraft_rcon_v1
    volumes:
      - world:/data
      - floodgate-config:/config/floodgate:ro
    ports:
      - target: 25565
        published: 25565
        protocol: tcp
        mode: host
      - target: 19132
        published: 19132
        protocol: udp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == groke
      restart_policy:
        condition: any

secrets:
  slothsoft_minecraft_rcon_v1:
    external: true

volumes:
  bluemap-config:
  bluemap-data:
  bluemap-web:
  floodgate-config:
    external: true
    name: minecraft_floodgate-config
  world:
    external: true
    name: minecraft_world
