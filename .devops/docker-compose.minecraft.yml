services:
    frontend:
        volumes:
            - bluemap-web:/var/www/html/WorldMap:ro
    world:
        image: itzg/minecraft-server:latest
        user: root
        cap_add:
            - SYS_NICE
        environment:
            EULA: "TRUE"
            TYPE: FABRIC
            ONLINE_MODE: "TRUE"
            ENFORCE_SECURE_PROFILE: "TRUE"
            MAX_MEMORY: 32G
            MODRINTH_PROJECTS: |
                fabric-api
                floodgate
            MODS: |
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/fabric
        volumes:
            - world:/data
        configs:
            - source: floodgate
              target: /config/floodgate/config.yml
        ports:
            - 25565:25565/tcp
            - 19132:19132/udp
        deploy:
          endpoint_mode: dnsrr
          replicas: 1
          placement:
            constraints:
              - node.hostname == groke
        restart: unless-stopped

    bluemap:
        image: ghcr.io/bluemap-minecraft/bluemap:latest
        command: -r -u
        volumes:
            - bluemap-config:/app/config
            - bluemap-data:/app/data
            - bluemap-web:/app/web
            - world:/app/server:ro
        deploy:
          endpoint_mode: dnsrr
          replicas: 1
          placement:
            constraints:
              - node.hostname == groke
        restart: unless-stopped

configs:
    floodgate:
        content: |
            key-file-name: key.pem
            username-prefix: "."
            replace-spaces: true

            disconnect:
              invalid-key: Please connect through the official Geyser
              invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

            player-link:
              enabled: true
              require-link: true
              enable-own-linking: false
              allowed: true
              link-code-timeout: 300
              type: sqlite
              enable-global-linking: true

            metrics:
              enabled: false
              uuid: 00000000-0000-0000-0000-000000000000

            config-version: 3

volumes:
    bluemap-config:
    bluemap-data:
    bluemap-web:
    world:
        external: true
        name: minecraft_world
