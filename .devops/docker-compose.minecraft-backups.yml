services:
  backup:
    image: itzg/mc-backup:latest
    entrypoint:
      - /bin/bash
      - -ec
      - |
        grep -q 'command rsync -a ' /opt/backup-loop.sh
        sed -i 's/command rsync -a /command rsync -rlt /' /opt/backup-loop.sh
        exec /usr/bin/backup "$$@"
      - --
    command:
      - loop
    environment:
      RCON_HOST: world
      RCON_PASSWORD_FILE: /run/secrets/slothsoft_minecraft_rcon_v1

      BACKUP_METHOD: rsync
      DEST_DIR: /backups/slothsoft
      BACKUP_NAME: slothsoft
      CRON_SCHEDULE: "0 3 * * 0"
      PRUNE_BACKUPS_DAYS: "0"
      ENABLE_SAVE_ALL: "true"
      ENABLE_SYNC: "true"

      EXCLUDES: ""

    volumes:
      - minecraft_world:/data:ro
      - minecraft_backups:/backups

    secrets:
      - slothsoft_minecraft_rcon_v1

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == groke
      restart_policy:
        condition: any

secrets:
  slothsoft_minecraft_rcon_v1:
    external: true

volumes:
  minecraft_world:
    external: true
  minecraft_backups:
    name: minecraft_backups
    driver: local
    driver_opts:
      type: cifs
      o: addr=192.168.194.3,username=Fren,password=,domain=KDG,vers=3.0,uid=1000,gid=1000,forceuid,forcegid,file_mode=0664,dir_mode=0775
      device: //192.168.194.3/MinecraftBackups
